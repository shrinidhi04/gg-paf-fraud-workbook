  <path class="red" d="M268 79c0-14 12-26 26-26 11 0 20 6 24 16 6-5 13-8 22-8 19 0 34 15 34 34H268c-11 0-20-9-20-20s9-20 20-20"/>
  <text class="title" x="400" y="82">Oracle Cloud Infrastructure (OCI)</text>

  <rect class="gg" x="258" y="122" width="265" height="380" rx="12"/>
  <text class="h1" x="391" y="165" text-anchor="middle">OCI GoldenGate</text>
  <text class="small" x="391" y="193" text-anchor="middle">Real-time capture and streaming</text>
  <rect class="card" x="292" y="238" width="198" height="210" rx="10"/>
  <path class="red" d="M334 280h35l28 28v54h-63z"/>
  <path class="red" d="M369 280v28h28"/>
