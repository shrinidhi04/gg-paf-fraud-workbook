  <path class="arrow" d="M193 312 H256"/>
  <text class="small" x="211" y="278" text-anchor="middle">Capture changes</text>

  <circle class="step" cx="563" cy="312" r="19"/>
  <text class="stepText" x="563" y="319" text-anchor="middle">2</text>
  <path class="arrow" d="M523 312 H604"/>
  <text class="small" x="563" y="278" text-anchor="middle">Stream data</text>

  <circle class="step" cx="908" cy="312" r="19"/>
  <text class="stepText" x="908" y="319" text-anchor="middle">3</text>
  <path class="arrow" d="M870 312 H943"/>
  <text class="small" x="908" y="278" text-anchor="middle">Explain risk</text>

  <rect class="mgmt" x="18" y="610" width="1162" height="120" rx="12"/>
  <text class="h2" x="600" y="640" text-anchor="middle">Monitoring and Management</text>
  <rect class="icon" x="75" y="667" width="45" height="35" rx="4"/>
  <circle class="icon" cx="123" cy="709" r="16"/>
  <text class="h2" x="155" y="682">GoldenGate Console</text>
  <text class="small" x="155" y="707">Manage extracts and data streams</text>
  <ellipse class="icon" cx="440" cy="677" rx="34" ry="13"/>
  <path class="icon" d="M406 677v36c0 8 15 13 34 13s34-5 34-13v-36"/>
  <text class="h2" x="500" y="682">GoldenGate MCP Server</text>
  <text class="small" x="500" y="707">Natural-language operations</text>
  <rect class="icon" x="765" y="667" width="42" height="42" rx="5"/>
  <line class="icon" x1="779" y1="681" x2="794" y2="681"/>
  <line class="icon" x1="779" y1="695" x2="794" y2="695"/>
  <text class="h2" x="835" y="682">PAF Agent Workflow</text>
  <text class="small" x="835" y="707">Manage fraud analysis agents</text>
  <rect class="icon" x="1030" y="667" width="42" height="42" rx="5"/>
  <path class="icon" d="M1043 700v-16M1053 700v-28M1063 700v-38"/>
  <text class="h2" x="1080" y="682">End-to-End</text>
  <text class="small" x="1080" y="707">AI trace</text>
</svg>
