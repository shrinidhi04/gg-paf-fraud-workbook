<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc">
  <title id="title">Real-Time AI Fraud Monitoring Architecture</title>
  <desc id="desc">Payment transactions are stored in Oracle AI Autonomous Database, captured and streamed by OCI GoldenGate, analyzed by Oracle AI Database Private Agent Factory, and shown in the Enterprise Fraud Monitoring Console.</desc>
  <defs>
    <style>
      .page{fill:#fff}.outer{fill:#fbfdff;stroke:#c9d7e8;stroke-width:2}.source{fill:#fbfdff;stroke:#c9d7e8;stroke-width:2}.gg{fill:#fff3f1;stroke:#f2aaa1;stroke-width:2}.paf{fill:#f4fbf5;stroke:#95cca8;stroke-width:2}.console{fill:#edf8ff;stroke:#74bff1;stroke-width:2}.card{fill:#fff;stroke:#c8d6e6;stroke-width:2}.dash{fill:#041a16;stroke:#2e6a83;stroke-width:2}.mgmt{fill:#fbfdff;stroke:#c9d7e8;stroke-width:2;stroke-dasharray:5 5}.title{font:700 26px Arial,Helvetica,sans-serif;fill:#0b1736}.h1{font:700 24px Arial,Helvetica,sans-serif;fill:#0b1736}.h2{font:700 19px Arial,Helvetica,sans-serif;fill:#0b1736}.body{font:16px Arial,Helvetica,sans-serif;fill:#283a54}.small{font:13px Arial,Helvetica,sans-serif;fill:#506278}.tiny{font:11px Arial,Helvetica,sans-serif;fill:#8aa19a}.white{font:700 14px Arial,Helvetica,sans-serif;fill:#eef8f4}.blue{fill:#0875d1}.icon{stroke:#073b4c;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.redIcon{stroke:#e21b1b;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.arrow{stroke:#0875d1;stroke-width:5;fill:none;marker-end:url(#arrow)}.darkArrow{stroke:#0b1736;stroke-width:4;fill:none;marker-end:url(#darkArrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0875d1"/></marker>
    <marker id="darkArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b1736"/></marker>
  </defs>
