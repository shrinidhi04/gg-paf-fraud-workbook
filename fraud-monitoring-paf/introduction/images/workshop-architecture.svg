  <text class="h1" x="397" y="169">OCI GoldenGate</text>
  <text class="small" x="397" y="195">Real-time data capture and distribution</text>
  <rect class="card" x="305" y="230" width="240" height="235" rx="8"/>
  <path class="redIcon" d="M356 274h24l22 22v44h-46z"/>
  <path class="redIcon" d="M380 274v22h22"/>
