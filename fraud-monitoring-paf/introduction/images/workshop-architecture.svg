  <rect class="paf" x="605" y="122" width="265" height="380" rx="12"/>
  <text class="h1" x="738" y="158" text-anchor="middle">Oracle AI Database</text>
  <text class="h1" x="738" y="187" text-anchor="middle">Private Agent Factory</text>
  <text class="small" x="738" y="215" text-anchor="middle">Build, run, and govern AI agents</text>
  <rect class="card" x="640" y="258" width="195" height="170" rx="10"/>
  <path class="icon" d="M698 295l10 24 26 8-26 9-10 24-10-24-26-9 26-8z"/>
  <path class="icon" d="M754 320l6 14 15 5-15 5-6 14-6-14-15-5 15-5z"/>
  <text class="h2" x="738" y="383" text-anchor="middle">Fraud Monitoring</text>
  <text class="h2" x="738" y="408" text-anchor="middle">Agent</text>

  <rect class="console" x="945" y="122" width="205" height="380" rx="12"/>
  <rect class="icon" x="988" y="162" width="56" height="42" rx="4"/>
  <path class="icon" d="M1016 204v28M991 232h50"/>
  <text class="h2" x="1048" y="272" text-anchor="middle">Enterprise Fraud</text>
  <text class="h2" x="1048" y="296" text-anchor="middle">Monitoring Console</text>
  <rect class="dash" x="972" y="330" width="152" height="120" rx="8"/>
  <text class="muted" x="990" y="354">EVENTS</text>
  <text class="white" x="990" y="374">5</text>
  <text class="muted" x="1052" y="354">SIGNALS</text>
  <text class="white" x="1052" y="374">10</text>
  <text class="white" x="990" y="416">900001</text>
  <rect x="1056" y="401" width="42" height="18" rx="9" fill="#ff5f7a"/>

  <circle class="step" cx="211" cy="312" r="19"/>
