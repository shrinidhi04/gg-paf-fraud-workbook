<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc">
  <title id="title">Real-Time AI Fraud Monitoring Architecture</title>
  <desc id="desc">Architecture showing payment transactions captured from Oracle Autonomous Database by OCI GoldenGate, streamed to Oracle AI Database Private Agent Factory, and displayed in the Enterprise Fraud Monitoring Console, with monitoring and management tools.</desc>
  <defs>
    <style>
      .bg{fill:#fff}
      .panel{fill:#fbfdff;stroke:#c9d7e8;stroke-width:2}
      .oci{fill:#fff;stroke:#c9d7e8;stroke-width:2}
      .gg{fill:#fff3f1;stroke:#f2aba2;stroke-width:2}
      .paf{fill:#f5fbf4;stroke:#9fd1ae;stroke-width:2}
      .console{fill:#eff9ff;stroke:#73bdf5;stroke-width:2}
      .card{fill:#fff;stroke:#c9d7e8;stroke-width:2}
      .dash{fill:#041915;stroke:#7ab1d8;stroke-width:2}
      .mgmt{fill:#fbfdff;stroke:#c9d7e8;stroke-width:2;stroke-dasharray:4 4}
      .h1{font:700 24px Arial,Helvetica,sans-serif;fill:#0b1736}
      .h2{font:700 18px Arial,Helvetica,sans-serif;fill:#0b1736}
      .body{font:15px Arial,Helvetica,sans-serif;fill:#24364f}
      .small{font:13px Arial,Helvetica,sans-serif;fill:#43546a}
      .blue{fill:#0b75d1}
      .arrow{stroke:#0b75d1;stroke-width:5;fill:none;marker-end:url(#arrow)}
      .darkline{stroke:#0b1736;stroke-width:4;fill:none;marker-end:url(#darkArrow)}
      .icon{stroke:#073b4c;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .redIcon{stroke:#e21b1b;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .whiteText{fill:#eef8f4;font:700 13px Arial,Helvetica,sans-serif}
      .dashText{fill:#a5b9b2;font:700 10px Arial,Helvetica,sans-serif}
      .badgeHigh{fill:#ff5f7a}
      .badgeLow{fill:#35d28a}
      .metric{fill:#08241e;stroke:#1f4d42;stroke-width:1.5}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0b75d1"/>
    </marker>
    <marker id="darkArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0b1736"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="680"/>

  <rect class="panel" x="10" y="86" width="225" height="430" rx="8"/>
  <text class="h2" x="112" y="122" text-anchor="middle">Payment Transactions</text>
  <text class="h2" x="112" y="146" text-anchor="middle">(Source System)</text>
  <rect class="icon" x="78" y="188" width="58" height="38" rx="4"/>
  <line class="icon" x1="88" y1="204" x2="126" y2="204"/>
  <line class="icon" x1="88" y1="216" x2="107" y2="216"/>
  <text class="body" x="112" y="274" text-anchor="middle">Card, online,</text>
  <text class="body" x="112" y="298" text-anchor="middle">and transfer activity</text>
  <path class="darkline" d="M112 315 V384"/>
  <ellipse class="icon" cx="112" cy="404" rx="36" ry="14"/>
  <path class="icon" d="M76 404v42c0 8 16 14 36 14s36-6 36-14v-42"/>
  <path class="icon" d="M76 424c0 8 16 14 36 14s36-6 36-14"/>
  <text class="h2" x="112" y="486" text-anchor="middle">Oracle AI</text>
  <text class="h2" x="112" y="511" text-anchor="middle">Autonomous Database</text>
  <text class="body" x="112" y="536" text-anchor="middle">(Transaction data)</text>

  <rect class="oci" x="260" y="18" width="1515" height="510" rx="8"/>
  <path class="redIcon" d="M302 58c0-13 11-24 24-24 10 0 19 6 22 15 5-4 11-6 18-6 17 0 30 13 30 30h-94c-10 0-18-8-18-18s8-18 18-18"/>
  <text class="h1" x="408" y="58">Oracle Cloud Infrastructure (OCI)</text>

  <circle class="blue" cx="235" cy="210" r="18"/>
  <text x="235" y="216" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text>
  <path class="arrow" d="M238 292 H278"/>

  <rect class="gg" x="275" y="78" width="325" height="395" rx="8"/>
  <path class="redIcon" d="M336 149c0-24 20-44 44-44 18 0 34 11 40 27 8-6 18-10 29-10 29 0 52 23 52 52H336c-20 0-36-16-36-36s16-36 36-36"/>
