<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Real-Time AI Fraud Monitoring Architecture</title>
  <desc id="desc">The lab architecture shows payment transactions stored in Oracle AI Autonomous Database, captured and streamed by OCI GoldenGate, analyzed by Oracle AI Database Private Agent Factory, and displayed in the Enterprise Fraud Monitoring Console.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#0b75d1"/>
    </marker>
    <style>
      .page{fill:#fff}
      .oci{fill:#fbfdff;stroke:#c8d6e6;stroke-width:2}
      .source{fill:#fbfdff;stroke:#c8d6e6;stroke-width:2}
      .gg{fill:#fff4f1;stroke:#f1a59b;stroke-width:2}
      .paf{fill:#f4fbf5;stroke:#93cfa8;stroke-width:2}
      .console{fill:#eef8ff;stroke:#70bdf4;stroke-width:2}
      .card{fill:#fff;stroke:#c8d6e6;stroke-width:2}
      .mgmt{fill:#fbfdff;stroke:#c8d6e6;stroke-width:2;stroke-dasharray:5 6}
      .dash{fill:#041b16;stroke:#2e7088;stroke-width:2}
      .title{font:700 27px Arial,Helvetica,sans-serif;fill:#0b1736}
      .h1{font:700 24px Arial,Helvetica,sans-serif;fill:#0b1736}
      .h2{font:700 19px Arial,Helvetica,sans-serif;fill:#0b1736}
      .body{font:16px Arial,Helvetica,sans-serif;fill:#2c3d55}
      .small{font:14px Arial,Helvetica,sans-serif;fill:#53677d}
      .white{font:700 14px Arial,Helvetica,sans-serif;fill:#effbf6}
      .muted{font:12px Arial,Helvetica,sans-serif;fill:#91aaa2}
      .icon{stroke:#073b4c;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .red{stroke:#e21b1b;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .arrow{stroke:#0b75d1;stroke-width:5;fill:none;marker-end:url(#arrow)}
      .step{fill:#0b75d1}
      .stepText{font:700 18px Arial,Helvetica,sans-serif;fill:#fff}
    </style>
  </defs>

  <rect class="page" width="1200" height="760"/>

  <rect class="source" x="18" y="105" width="175" height="430" rx="10"/>
  <text class="h2" x="106" y="145" text-anchor="middle">Payment</text>
  <text class="h2" x="106" y="170" text-anchor="middle">Transactions</text>
  <text class="small" x="106" y="196" text-anchor="middle">Source system</text>
  <rect class="icon" x="70" y="238" width="70" height="46" rx="6"/>
  <line class="icon" x1="84" y1="257" x2="126" y2="257"/>
  <line class="icon" x1="84" y1="271" x2="108" y2="271"/>
  <text class="body" x="106" y="335" text-anchor="middle">Card, online,</text>
  <text class="body" x="106" y="359" text-anchor="middle">and transfer</text>
  <text class="body" x="106" y="383" text-anchor="middle">activity</text>
  <path class="arrow" d="M106 405 V452"/>
  <ellipse class="icon" cx="106" cy="477" rx="40" ry="16"/>
  <path class="icon" d="M66 477v48c0 9 18 16 40 16s40-7 40-16v-48"/>
  <path class="icon" d="M66 501c0 9 18 16 40 16s40-7 40-16"/>
  <text class="h2" x="106" y="515" text-anchor="middle">Oracle AI</text>
  <text class="h2" x="106" y="540" text-anchor="middle">Autonomous DB</text>

