  <text class="body" x="430" y="314">Capture changes</text>
  <text class="body" x="430" y="338">from source database</text>
  <path class="darkline" d="M370 352 V405"/>
  <path class="redIcon" d="M345 425c18-20 42 20 62 0s42 20 62 0"/>
  <path class="redIcon" d="M345 446c18-20 42 20 62 0s42 20 62 0"/>
  <text class="h2" x="430" y="430">Data Stream</text>
  <text class="body" x="430" y="454">Publish changes using</text>
  <text class="body" x="430" y="478">OCI GoldenGate Data Streams</text>
  <text class="body" x="430" y="502">(AsyncAPI)</text>

  <circle class="blue" cx="560" cy="244" r="18"/>
  <text x="560" y="250" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text>
  <path class="arrow" d="M600 322 H662"/>

  <rect class="paf" x="645" y="82" width="410" height="390" rx="8"/>
  <path class="icon" d="M704 163c-12-6-20-18-20-33 0-21 17-38 38-38 10 0 19 4 26 11 7-7 16-11 26-11 21 0 38 17 38 38 0 15-8 27-20 33"/>
  <path class="icon" d="M748 103v88M704 130h88"/>
  <text class="h1" x="735" y="132">Oracle AI Database</text>
  <text class="h1" x="735" y="160">Private Agent Factory (PAF)</text>
  <text class="body" x="735" y="190">Build, run, and govern AI agents</text>
  <text class="body" x="735" y="214">with enterprise data</text>
  <rect class="card" x="663" y="254" width="240" height="195" rx="8"/>
  <path class="icon" d="M704 330c-18 8-30 26-30 46 0 27 22 49 49 49 20 0 38-12 45-30"/>
  <path class="icon" d="M721 290l8 19 20 6-20 7-8 19-8-19-20-7 20-6z"/>
  <path class="icon" d="M766 313l5 11 12 4-12 4-5 11-5-11-12-4 12-4z"/>
  <text class="h2" x="725" y="288">Fraud Monitoring Agent</text>
  <text class="body" x="675" y="368">Analyze transactions, score risk,</text>
  <text class="body" x="675" y="393">identify suspicious activity, and</text>
  <text class="body" x="675" y="418">provide explanations grounded</text>
  <text class="body" x="675" y="443">in transaction evidence</text>

  <circle class="blue" cx="1045" cy="276" r="18"/>
  <text x="1045" y="282" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text>
  <path class="arrow" d="M1036 348 H1168"/>

  <rect class="console" x="1165" y="32" width="590" height="455" rx="8"/>
  <rect class="icon" x="1228" y="68" width="44" height="33" rx="2"/>
  <path class="icon" d="M1250 101v22M1230 123h40"/>
  <text class="h1" x="1290" y="80">Enterprise Fraud Monitoring Console</text>
  <text class="body" x="1290" y="108">Internal real-time transaction surveillance</text>
  <rect class="dash" x="1185" y="130" width="540" height="330" rx="8"/>
  <text class="dashText" x="1204" y="154">GLOBAL BANK FRAUD OPERATIONS</text>
  <text class="whiteText" x="1204" y="178">Enterprise Fraud Monitoring Console</text>
  <rect class="metric" x="1204" y="205" width="118" height="48" rx="4"/>
  <rect class="metric" x="1334" y="205" width="118" height="48" rx="4"/>
  <rect class="metric" x="1464" y="205" width="118" height="48" rx="4"/>
  <text class="dashText" x="1220" y="224">EVENTS</text><text class="whiteText" x="1220" y="246">5</text>
  <text class="dashText" x="1350" y="224">SIGNALS</text><text class="whiteText" x="1350" y="246">10</text>
  <text class="dashText" x="1480" y="224">BRIEFS</text><text class="whiteText" x="1480" y="246">5</text>
  <rect class="metric" x="1204" y="275" width="160" height="155" rx="4"/>
  <rect class="metric" x="1374" y="275" width="140" height="155" rx="4"/>
  <rect class="metric" x="1524" y="275" width="175" height="155" rx="4"/>
  <text class="whiteText" x="1220" y="302">900003</text><rect class="badgeLow" x="1317" y="288" width="36" height="18" rx="9"/>
  <text class="whiteText" x="1220" y="350">900002</text><rect class="badgeHigh" x="1317" y="336" width="36" height="18" rx="9"/>
  <text class="whiteText" x="1220" y="398">900001</text><rect class="badgeHigh" x="1317" y="384" width="36" height="18" rx="9"/>
  <rect x="1390" y="306" width="108" height="60" rx="5" fill="#0b2a24" stroke="#1f4d42"/>
  <text class="whiteText" x="1406" y="338">Online Electronics Store</text>
  <text class="dashText" x="1540" y="302">AI Analyst Brief</text>
  <rect x="1540" y="325" width="140" height="24" rx="12" fill="#0b5e86"/>
  <text class="whiteText" x="1550" y="342">PAF response attached</text>
  <rect x="1540" y="370" width="140" height="44" rx="5" fill="#0b2a24" stroke="#1f4d42"/>
  <text class="dashText" x="1550" y="392">Alert Review Summary</text>

  <rect class="mgmt" x="10" y="550" width="1765" height="130" rx="8"/>
  <text class="h2" x="900" y="545" text-anchor="middle">Monitoring and Management</text>
  <rect class="icon" x="74" y="574" width="50" height="38" rx="4"/>
  <circle class="icon" cx="126" cy="623" r="20"/>
  <text class="h2" x="162" y="584">OCI GoldenGate</text>
  <text class="h2" x="162" y="610">Deployment Console</text>
  <text class="body" x="162" y="635">Monitor and manage extracts, replicats, and data streams</text>
  <ellipse class="icon" cx="475" cy="582" rx="36" ry="13"/>
  <path class="icon" d="M439 582v48c0 8 16 13 36 13s36-5 36-13v-48"/>
  <text class="h2" x="525" y="584">GoldenGate MCP Server</text>
  <text class="body" x="525" y="611">Manage GoldenGate using natural language (MCP)</text>
  <rect class="icon" x="820" y="575" width="50" height="52" rx="4"/>
  <line class="icon" x1="834" y1="590" x2="856" y2="590"/>
  <line class="icon" x1="834" y1="606" x2="856" y2="606"/>
  <text class="h2" x="900" y="584">PAF Agent Workflow</text>
  <text class="body" x="900" y="611">View and manage the fraud monitoring agent</text>
  <rect class="icon" x="1264" y="575" width="52" height="52" rx="4"/>
  <path class="icon" d="M1280 615v-20M1292 615v-34M1304 615v-48"/>
  <text class="h2" x="1340" y="584">End-to-End Monitoring</text>
  <text class="body" x="1340" y="611">Trace transactions from capture to streaming, storage,</text>
  <text class="body" x="1340" y="635">risk scoring, and analysis</text>
</svg>
